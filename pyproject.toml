[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsn"
version = "0.1.1"
description = "Pure Python implementation of Variance Stabilization and Normalization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.urls]
Repository = "https://github.com/animesh/vsn"
Issues = "https://github.com/animesh/vsn/issues"

[tool.setuptools]
py-modules = ["vsn"]
